<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
</head>
<body>
      <div class="box">
        <form>
            <h1>Create Account</h1>
            <h2>Create your account to get start</h2>
            <div>
            <label for="user" style="display: block;">Username</label>
            </div>
            <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text"  id="user" placeholder="Enter your Username">
            </div>
            
            <label for="Email" style="display: block;">Email</label>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
            <input type="email" id="passkey" placeholder="Enter your Email">
             <div>
            <label for="acc-passkey" style="display: block;">Password</label>
            </div>
              <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password"  id="user" placeholder="Enter your Password">
            </div>
             <div>
            <label for="acc-passkey" style="display: block;">Confrom Password</label>
            </div>
              <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password"  id="user" placeholder="Re-enter your password">
            </div>
     
            <button type="submit">Sign Up</button>
            <p class="signup">
                Aready have an account?
                <a href="../main/login.html">Login</a>
            </p>
        </form>
       

    </div>
    
</body>
</html>
