<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgetPassword</title>
    <link rel="stylesheet" href="For.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
</head>
<body>
     <div class="box">
        <form>
            <h1>Forgot Password?</h1>
            <h2>Enter your email to reset your password</h2>
            <div>
            

            <label for="user-email" style="display: block;">Email</label>
            </div>
            <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input type="email"  id="user" placeholder="Enter your Email" required>
            </div>
            
           
            <button type="submit">Send Reset Link</button>
            <p class="signup">
                Rember your password?
                <a href="../main/login.html">Login</a>
            </p>
        </form>
       

    </div>
    
</body>
</html>
