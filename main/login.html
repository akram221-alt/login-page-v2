<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loginpage</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
</head>
<body>
    <div class="box">
        <form>
            <h1>Login</h1>
            <h2>Welcome back!please login to continue</h2>
            <div>
            

            <label for="user" style="display: block;">Username</label>
            </div>
            <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text"  id="user" placeholder="Enter your Username">
            </div>
            
            <label for="passkey" style="display: block;">Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
            <input type="password" id="passkey" placeholder="Enter your Password">
            <div class="links">
                <lable>
                    <input type="checkbox">
                    Rember me
                </lable>


                <a href="../Forgetpassword/For.html">Forgot Password?</a>
            </div>

            </div>
            <button type="submit">Login</button>
            <p class="signup">
                Don't have an account?
                <a href="../signup/signup.html">Sign Up</a>
            </p>
        </form>
       

    </div>


  
    
</body>
</html>
